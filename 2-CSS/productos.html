    <title>Catalogo de Productos</title>
    <link rel="stylesheet" href="catalogo.css" type="text/css" />

  <body class="grid-container">
    <header class="item1">Catalogo de Productos</header>
    <nav class="item2">
      <a href="productos.html">Catalogo de Productos</a>
      <a href="">Carrito de Compras</a>

    <aside class="item3">
      <form name="filter">
        <fieldset>
          <legend>Busqueda</legend>
          <label for="search">Buscar:</label>
          <input type="text" id="search" name="search" />
        </fieldset>
        <fieldset>
          <legend>Precios</legend>
          <p>
            <label for="minimo">Minimo:</label>
            <input type="number" id="minimo" name="precio-min" min="0" />
          </p>
          <p>
            <label for="maximo">Maximo:</label>
            <input type="number" id="maximo" name="precio-max" min="0" />
          </p>
        </fieldset>
        <fieldset>
          <legend>Tipo de Productos</legend>
          <p>
            <input
              type="checkbox"
              id="protectores"
              name="tipo"
              value="protectores"
            />
            <label for="protectores">Protectores</label>
          </p>
          <p>
            <input
              type="checkbox"
              name="tipo"
              id="entrenamiento"
              value="entrenamiento"
            />
            <label for="entrenamiento">Entrenamiento</label>
          </p>
          <p>
            <input type="checkbox" name="tipo" id="dobok" value="dobok" />
            <label for="dobok">Dobok</label>
          </p>
        </fieldset>
      </form>
    </aside>
