<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalogo de Productos</title>
    <link rel="stylesheet" href="catalogo.css" type="text/css" />
    <script src="tienda.js" type="text/javascript"></script>
  </head>
  <body class="grid-container" onload="cargarProductos()">
    <header class="item1">Catalogo de Productos</header>
    <nav class="item2">
      <a href="productos.html">Catalogo de Productos</a>
      <a href="">Carrito de Compras</a>
    </nav>
    <aside class="item3">
      <form name="filter">
        <fieldset>
          <legend>Busqueda</legend>
          <label for="search">Buscar:</label>
          <input type="text" id="search" name="search" />
        </fieldset>
        <fieldset>
          <legend>Precios</legend>
          <p>
            <label for="minimo">Minimo:</label>
            <input type="number" id="minimo" name="precio-min" min="0" />
          </p>
          <p>
            <label for="maximo">Maximo:</label>
            <input type="number" id="maximo" name="precio-max" min="0" />
          </p>
        </fieldset>
        <fieldset>
          <legend>Tipo de Productos</legend>
          <p>
            <input
              type="checkbox"
              id="protectores"
              name="tipo"
              value="protectores"
            />
            <label for="protectores">Protectores</label>
          </p>
          <p>
            <input
              type="checkbox"
              name="tipo"
              id="entrenamiento"
              value="entrenamiento"
            />
            <label for="entrenamiento">Entrenamiento</label>
          </p>
          <p>
            <input type="checkbox" name="tipo" id="dobok" value="dobok" />
            <label for="dobok">Dobok</label>
          </p>
        </fieldset>
      </form>
    </aside>
    <dialog id="modal">
        <h2>Detalle del Producto</h2>
        <h3 id="titulo-producto">Cabezal Cerrado</h3>
        <p id="descr-producto">Cabezal de Sparring. Disponible del talle 1 al 3. En color rojo y azul.</p>
        <button type="button" onclick="cerrarModal()">Cerrar</button>
    </dialog>
    <main class="item4" id="mostrar-catalogo"></main>
    <footer class="item5">Contacto</footer>
  </body>
</html>
