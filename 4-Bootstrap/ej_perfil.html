<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <!-- Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile {
            margin-top: -80px;
        }
        .profile img {
            width: 8rem;
        }
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
    </style>
</head>
<body>

    <div class="d-flex justify-content-center my-5">
        <div class="card" style="width: 22rem;">
            <!-- Imagen de Portada -->
            <img src="../2-CSS/imagenes/fondo_mario.jpg" alt="" class="card-img-top">
            
            <!-- Cuerpo del Perfil -->
            <div class="card-body text-center">
                <div class="position-relative profile">
                    <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle border border-3 border-white bg-white">
                </div>
                <h5 class="card-title fw-bold mt-2">tirednumbs</h5>
                <p class="card-text text-secondary small">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. In pulvinar lacus risus, et convallis ante sodales eget. Nulla ornare dui non tellus varius tincidunt.
                </p>
                <a href="" class="btn btn-primary btn-sm px-3">Ver perfil</a>
            </div>

            <!-- Lista inferior tipo LinkedIn -->
            <div class="list-group list-group-flush small">
                <a href="" class="list-group-item list-group-item-action d-flex align-items-center gap-2 text-secondary py-2">
                    <span class="material-symbols-outlined fs-5">comment</span>
                    Ir a mensajes
                </a>
                <a href="" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between text-secondary py-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="material-symbols-outlined fs-5">notifications_active</span>
                        Notificaciones
                    </div>
                    <span class="badge rounded-pill bg-danger">+99</span>
                </a>
                <a href="" class="list-group-item list-group-item-action d-flex align-items-center gap-2 text-secondary py-2">
                    <span class="material-symbols-outlined fs-5">group</span>
                    Solicitudes Pendientes
                </a>
                <a href="" class="list-group-item list-group-item-action d-flex align-items-center gap-2 text-secondary py-2">
                    <span class="material-symbols-outlined fs-5">videocam</span>
                    Llamar
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
