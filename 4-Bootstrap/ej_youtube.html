<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio YouTube</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .action-buttons {
            height: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card {
            width: 28rem;
            transform: scale(1);
            transition: transform 0.1s ease;
        }

        .card:hover {
            transform: scale(1.05);
            z-index: 100;
        }

        .card:hover .action-buttons {
            height: auto;
            opacity: 1;
        }

        .col-2 img {
            width: 2.8rem;
        }
    </style>
</head>
<body class="bg-dark p-5">

    <div class="container d-flex gap-4 justify-content-center">

        <!-- Card con hover -->
        <div class="card text-white text-bg-dark border-0">
            <a href="#" class="text-light text-decoration-none">
                <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_01.png" alt="" class="card-img-top">
            </a>
            
            <div class="card-body p-3">
                <div class="row align-items-start">
                    <div class="col-2 pe-0">
                        <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle">
                    </div>
                    <div class="col-10 ps-2">
                        <div class="card-title mb-1">
                            <a href="#" class="text-light text-decoration-none fw-semibold">
                                Taller de Desarrollo Web - VaciarCarrito y EliminarProducto
                            </a>
                        </div>
                        <div class="card-title mb-1">
                            <a href="#" class="text-secondary text-decoration-none small">
                                Taller de Desarrollo Web - Otro Ejercicio
                            </a>
                        </div>
                        <div class="text-secondary small">
                            230 vistas - 1 día
                        </div>
                    </div>
                </div>

                <!-- Botones de acción sin fondo, puro texto como el diseño -->
                <div class="row action-buttons pt-3 overflow-hidden text-uppercase fw-bold small">
                    <div class="col-6">
                        <a href="#" class="text-secondary text-decoration-none d-block">
                            VER MÁS TARDE
                        </a>
                    </div>
                    <div class="col-6 text-end">
                        <a href="#" class="text-secondary text-decoration-none d-block">
                            AGREGAR A LA FILA
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
