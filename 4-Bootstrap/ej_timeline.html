<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container border mt-5">
        <!-- Encabezado: Meses -->
        <div class="row text-center bg-black text-white">
            <div class="col-6 border-end">
                <div class="row">
                    <div class="col fw-bold p-2">ENERO</div>
                </div>
            </div>
            <div class="col-6">
                <div class="row">
                    <div class="col fw-bold p-2">FEBRERO</div>
                </div>
            </div>
        </div>

        <!-- Encabezado: Semanas (4 por mes = 8 columnas de col-3 dentro de cada col-6) -->
        <div class="row text-center bg-black text-white border-top border-secondary">
            <div class="col-6 border-end">
                <div class="row">
                    <div class="col-3 border-end border-secondary py-1 fs-6">Semana 1</div>
                    <div class="col-3 border-end border-secondary py-1 fs-6">Semana 2</div>
                    <div class="col-3 border-end border-secondary py-1 fs-6">Semana 3</div>
                    <div class="col-3 py-1 fs-6">Semana 4</div>
                </div>
            </div>
            <div class="col-6">
                <div class="row">
                    <div class="col-3 border-end border-secondary py-1 fs-6">Semana 1</div>
                    <div class="col-3 border-end border-secondary py-1 fs-6">Semana 2</div>
                    <div class="col-3 border-end border-secondary py-1 fs-6">Semana 3</div>
                    <div class="col-3 py-1 fs-6">Semana 4</div>
                </div>
            </div>
        </div>

        <!-- Tarjeta 1: Completada (arranca al inicio) -->
        <div class="row p-4">
            <div class="row py-2">
                <div class="item col-5 rounded-2 bg-secondary text-white p-2">
                    <div class="row">
                        <div class="col-10">
                            <div class="status fs-6 text-info">Completada</div>
                            <div class="title fw-bold fs-5">Definir Arquitectura</div>
                            <div class="date opacity-50 fs-6">20 Enero</div>
                        </div>
                        <div class="col-2 d-flex align-items-center gap-1 p-1">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle border" width="32" />
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle border" width="32" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tarjeta 2: En Progreso (desplazada con col-3) -->
        <div class="row p-4">
            <div class="row py-2">
                <div class="col-3"></div>
                <div class="item col-5 rounded-2 bg-secondary text-white p-2">
                    <div class="row">
                        <div class="col-10">
                            <div class="status fs-6 text-warning">En Progreso</div>
                            <div class="title fw-bold fs-5">Definir Arquitectura</div>
                            <div class="date opacity-50 fs-6">20 Enero</div>
                        </div>
                        <div class="col-2 d-flex align-items-center gap-1 p-1">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle border" width="32" />
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle border" width="32" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tarjeta 3: Bloqueada (desplazada con col-4) -->
        <div class="row p-4">
            <div class="row py-2">
                <div class="col-4"></div>
                <div class="item col-5 rounded-2 bg-secondary text-white p-2">
                    <div class="row">
                        <div class="col-10">
                            <div class="status fs-6 text-danger">Bloqueada</div>
                            <div class="title fw-bold fs-5">Definir Arquitectura</div>
                            <div class="date opacity-50 fs-6">20 Enero</div>
                        </div>
                        <div class="col-2 d-flex align-items-center gap-1 p-1">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle border" width="32" />
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="" class="rounded-circle border" width="32" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
