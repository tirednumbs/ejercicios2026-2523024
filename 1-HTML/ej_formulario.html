<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
      form {
        display: block;
        margin-top: 0em;
      }
    </style>
  </head>
  <body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>
      Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!
    </h3>

    <form id="formulario_suscripcion">
      <fieldset>
        <legend>Formulario de Registro</legend>
        <p>
          <label for="nombre">Nombre:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Nombre"
            size="40"
            maxlength="40"
          />
        </p>
        <p>
          <label for="apellido">Apellido:</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            placeholder="Apellido"
            size="40"
            maxlength="40"
          />
        </p>
        <p>
          Sexo: <label for="sexo_masculino">Masculino</label>
          <input type="radio" id="sexo_masculino" name="sexo" value="masculino" /> <label for="sexo_femenino">Femenino</label>
          <input type="radio" id="sexo_femenino" name="sexo" value="femenino" />
        </p>
        <p>
          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" placeholder="Edad" maxlength="3" />
        </p>
        <p>
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="email@dominio.com"
            size="40"
            maxlength="40"
          />
        </p>
        <p>
          <label for="usuario">Usuario:</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="usuario"
            size="40"
            maxlength="40"
          />
        </p>
        <p>
          <label for="pass">Password:</label>
          <input
            type="password"
            id="pass"
            name="pass"
            placeholder="password"
            size="40"
            maxlength="40"
          />
        </p>
        <p>
          <label for="confirmar_pass">Confirmar Password:</label>
          <input
            type="password"
            id="confirmar_pass"
            name="confirmar_pass"
            placeholder="password"
            size="40"
            maxlength="40"
          />
        </p>
        <p>
          Tipo de servicio: <label for="servicio_free">Free</label>
          <input type="checkbox" id="servicio_free" name="tipo_servicio" value="free" /> / <label for="servicio_standard">Standard</label>
          <input type="checkbox" id="servicio_standard" name="tipo_servicio" value="standard" /> /
          <label for="servicio_premium">Premium</label> <input type="checkbox" id="servicio_premium" name="tipo_servicio" value="premium" />
        </p>
        <p>
          <label for="tema">Tema:</label>
          <select id="tema">
            <option>Política</option>
            <option>Negocios</option>
            <option>Tecnología</option>
            <option>Salud</option>
          </select>
        </p>
        <p><label for="comentario">Agregue un comentario:</label> <textarea id="comentario"></textarea></p>
        <p>
          <input type="submit" value="Boton de Enviar" />
        </p>
      </fieldset>
    </form>
  </body>
</html>
